services:
  stock-opname-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: stock_opname_app
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production

  stock-opname-wabot:
    build:
      context: ./wabot
      dockerfile: Dockerfile
    container_name: stock_opname_wabot
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./wabot/.env
    environment:
      - PORT=3001
      - APPS_SCRIPT_URL=https://script.google.com/macros/s/AKfycbyLDBXj86JNfidv5tgnryVygaEsbsuPePuOtVN7O2iYA4DE8dR2In5j2xfuuWU3AGOK/exec
      - DATABASE_CSV_URL=https://docs.google.com/spreadsheets/d/1_HvmBaEqFpOCBPXJuI4eMbhsKIDe5RhOrHo7h2kqt2c/export?format=csv&gid=1367299058
      - AUTH_FOLDER=/app/auth_info_baileys
      - DATA_DIR=/app/data
    volumes:
      - ./wabot/auth_info_baileys:/app/auth_info_baileys
      - ./data/ppo:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    # Free random URL tunnel - no domain/account needed
    # Metrics API on port 2000 lets the bot fetch the live URL via:
    #   GET http://cloudflared:2000/quicktunnel -> {"hostname":"abc123.trycloudflare.com"}
    command: tunnel --no-autoupdate --url http://stock-opname-web:80 --metrics 0.0.0.0:2000
    depends_on:
      - stock-opname-web
      - stock-opname-wabot
