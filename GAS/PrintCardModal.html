<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title><?= (data && data.title) ? data.title : 'Cetak Kartu Stok Material' ?></title>
  <!-- Google Fonts: Roboto & Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- JsBarcode library for barcode rendering -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      background: #1e1e24;
      color: #212121;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Screen Toolbar */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: #23232e;
      border-bottom: 2px solid #3d3d52;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }

    .toolbar-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-badge {
      font-size: 13px;
      font-weight: 800;
      color: #00E676;
      background: rgba(0,230,118,0.12);
      border: 1px solid rgba(0,230,118,0.35);
      padding: 6px 12px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .summary-badge {
      font-size: 13px;
      font-weight: 700;
      color: #e8eaf6;
      background: #2e2e40;
      border: 1px solid #545472;
      padding: 6px 14px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-print {
      background: #00E676;
      color: #004D40;
      font-weight: 800;
      font-size: 13px;
      border-radius: 6px;
      padding: 8px 20px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,230,118,0.3);
    }
    .btn-print:hover {
      background: #69F0AE;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,230,118,0.45);
    }

    .btn-close {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      border-radius: 6px;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-close:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Pages Container */
    #pagesContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 15px 0 30px 0;
    }

    /* ========================================================
       A4 PAPER CONTAINER (210mm x 297mm)
       ======================================================== */
    .a4-sheet {
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      margin: 15px auto;
      background: #ffffff;
      padding: 6mm 4mm;
      box-sizing: border-box;
      box-shadow: 0 4px 25px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }

    /* ========================================================
       SINGLE ITEM CARD (TCARD LEFT HALF):
       Exact 96mm x 138mm on A4 (4 Cards in 2x2 Grid with 1.5mm gap)
       ======================================================== */
    .grid-single-4 {
      display: grid;
      grid-template-columns: 96mm 96mm;
      grid-template-rows: 138mm 138mm;
      gap: 1.5mm;
      justify-content: center;
      align-content: center;
      width: 100%;
      height: 100%;
    }

    .card-single-box {
      width: 96mm;
      height: 138mm;
      border: 2px solid #000000;
      padding: 3mm 3.5mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    /* Chamfer / Diagonal Corner Cut Guidelines (45deg cutting line matching Tcard) */
    .cut-line {
      position: absolute;
      width: 9mm;
      height: 9mm;
      pointer-events: none;
      z-index: 5;
    }
    .cut-line-tl {
      top: 0;
      left: 0;
    }
    .cut-line-tr {
      top: 0;
      right: 0;
    }

    .single-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #000000;
      padding-bottom: 1.5mm;
      margin-bottom: 1.5mm;
      height: 17mm;
    }

    .logo-container {
      width: 25mm;
      height: 16mm;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .logo-img {
      max-width: 100%;
      max-height: 15mm;
      object-fit: contain;
    }

    .hole-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      margin: 0 auto;
    }
    .hole-circle {
      width: 6mm;
      height: 6mm;
      border: 1.2px dashed #424242;
      border-radius: 50%;
      background: #ffffff;
      position: relative;
    }
    .hole-lbl {
      font-size: 5pt;
      font-weight: 700;
      color: #616161;
      letter-spacing: 0.5px;
    }

    .barcode-container {
      width: 38mm;
      height: 15mm;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .barcode-svg {
      width: 100%;
      max-height: 14mm;
    }

    .main-card-title {
      font-size: 11.5pt;
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.5px;
      margin: 1mm 0 1.5mm 0;
      color: #000000;
      text-transform: uppercase;
    }

    .meta-fields {
      width: 100%;
      font-size: 8.5pt;
      border-collapse: collapse;
      margin-bottom: 2mm;
    }
    .meta-fields td {
      padding: 0.7mm 1mm;
      vertical-align: middle;
    }
    .meta-fields .lbl {
      font-weight: 700;
      color: #000000;
      width: 26mm;
      white-space: nowrap;
    }
    .meta-fields .txt {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #000000;
      word-break: break-all;
    }

    /* Ledger Table (15 physical handwritten rows) */
    .table-ledger {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000000;
      flex: 1;
    }
    .table-ledger th {
      border: 1px solid #000000;
      font-size: 6.5pt;
      font-weight: 700;
      padding: 1mm 0.5mm;
      text-align: center;
      background: #e0e0e0;
      color: #000000;
      height: 4.5mm;
    }
    .table-ledger td {
      border: 1px solid #000000;
      font-size: 6.5pt;
      height: 4.5mm;
      padding: 0 1mm;
      text-align: center;
      vertical-align: middle;
    }
    .table-ledger .c-no { width: 6mm; font-weight: 700; }
    .table-ledger .c-date { width: 14mm; }
    .table-ledger .c-move { width: 17mm; }
    .table-ledger .c-mut { width: 14mm; }
    .table-ledger .c-stock { width: 14mm; }
    .table-ledger .c-note { width: 23mm; }

    /* ========================================================
       GROUP CARD (TCARD RIGHT HALF):
       Exact 198mm x 138mm (2 Cards per A4 Sheet)
       ======================================================== */
    .grid-group-2 {
      display: flex;
      flex-direction: column;
      gap: 3mm;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .card-group-box {
      width: 198mm;
      height: 138mm;
      border: 2px solid #000000;
      padding: 3.5mm 5mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    .group-cut-divider {
      width: 100%;
      height: 1px;
      border-top: 1px dashed #757575;
      margin: 1mm 0;
      position: relative;
    }
    .group-cut-divider::after {
      content: '✂ POTONG DI SINI (A5 HALF PAGE)';
      position: absolute;
      top: -6px;
      right: 10px;
      font-size: 6pt;
      background: #ffffff;
      padding: 0 5px;
      color: #757575;
      font-weight: 700;
    }

    .qr-container {
      width: 32mm;
      height: 16mm;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .qr-img {
      width: 15mm;
      height: 15mm;
      object-fit: contain;
    }

    .table-group-ledger {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000000;
      flex: 1;
    }
    .table-group-ledger th {
      border: 1px solid #000000;
      font-size: 7.5pt;
      font-weight: 700;
      padding: 1.2mm 1mm;
      text-align: center;
      background: #e0e0e0;
      color: #000000;
      height: 5mm;
    }
    .table-group-ledger td {
      border: 1px solid #000000;
      font-size: 7pt;
      height: 4.8mm;
      padding: 0 1.5mm;
      vertical-align: middle;
    }
    .table-group-ledger .gc-no { width: 10mm; text-align: center; font-weight: 700; }
    .table-group-ledger .gc-komat { width: 35mm; font-family: 'Roboto Mono', monospace; font-weight: 700; }
    .table-group-ledger .gc-name { width: 75mm; }
    .table-group-ledger .gc-mut { width: 35mm; text-align: center; }
    .table-group-ledger .gc-stock { width: 35mm; text-align: center; font-family: 'Roboto Mono', monospace; font-weight: 700; }

    /* ========================================================
       PRINT RULES (@media print)
       ======================================================== */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .toolbar {
        display: none !important;
      }

      #pagesContainer {
        padding: 0 !important;
        margin: 0 !important;
      }

      .a4-sheet {
        width: 210mm !important;
        height: 297mm !important;
        min-height: 297mm !important;
        margin: 0 !important;
        padding: 6mm 4mm !important;
        border: none !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
      }

      .a4-sheet:last-child,
      .a4-sheet:last-of-type {
        page-break-after: auto !important;
        break-after: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Screen Toolbar -->
  <div class="toolbar">
    <div class="toolbar-info">
      <span class="mode-badge">
        <?= (data && data.mode === 'group') ? '📦 KARTU GROUP (2/A4)' : '🏷️ KARTU SINGLE (4/A4)' ?>
      </span>
      <span class="summary-badge">
        <?= (data && data.summary) ? data.summary : 'Siap Dicetak' ?>
      </span>
    </div>
    <div class="toolbar-actions">
      <button class="btn-print" onclick="window.print()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>CETAK SEKARANG (PRINT)</span>
      </button>
      <button class="btn-close" onclick="google.script.host.close()">
        ✕ Tutup
      </button>
    </div>
  </div>

  <!-- Dynamic Pages Container -->
  <div id="pagesContainer">
    <? if (data && data.mode === 'single') { ?>
      <!-- SINGLE ITEM CARDS: 4 CARDS PER A4 SHEET -->
      <? for (var p = 0; p < data.pages.length; p++) {
           var page = data.pages[p];
      ?>
        <div class="a4-sheet">
          <div class="grid-single-4">
            <? for (var c = 0; c < page.cards.length; c++) {
                 var card = page.cards[c];
            ?>
              <div class="card-single-box">
                <!-- Diagonal Corner Cut Guidelines (45deg cutting line matching Tcard) -->
                <svg class="cut-line cut-line-tl" viewBox="0 0 10 10" title="diagonal upr to btl">
                  <line x1="0" y1="10" x2="10" y2="0" stroke="#616161" stroke-dasharray="2,1.5" stroke-width="0.8"/>
                </svg>
                <svg class="cut-line cut-line-tr" viewBox="0 0 10 10" title="diagonal upl to btr">
                  <line x1="0" y1="0" x2="10" y2="10" stroke="#616161" stroke-dasharray="2,1.5" stroke-width="0.8"/>
                </svg>

                <div class="single-header">
                  <div class="logo-container">
                    <img src="<?= data.logoUrl ?>" class="logo-img" alt="Logo Rekaindo">
                  </div>
                  <div class="hole-indicator" title="Hole Punch Guide">
                    <div class="hole-circle"></div>
                    <span class="hole-lbl">HOLE</span>
                  </div>
                  <div class="barcode-container">
                    <? if (card.isBlank) { ?>
                      <div style="font-size:7pt; color:#9e9e9e; font-style:italic;">[ BARCODE ]</div>
                    <? } else { ?>
                      <svg class="barcode-svg" data-barcode="<?= card.barcodeValue ?>"></svg>
                    <? } ?>
                  </div>
                </div>

                <div class="main-card-title">KARTU STOCK MATERIAL</div>

                <table class="meta-fields">
                  <tr>
                    <td class="lbl">Kode Material :</td>
                    <td class="txt"><?= card.isBlank ? '..................................................' : (card.kodeMaterial || '-') ?></td>
                  </tr>
                  <tr>
                    <td class="lbl">Deskription :</td>
                    <td class="txt"><?= card.isBlank ? '..................................................' : (card.namaBarang || '-') ?></td>
                  </tr>
                  <tr>
                    <td class="lbl">Location :</td>
                    <td class="txt"><?= card.isBlank ? '..................................................' : (card.lokasiRak || '-') ?></td>
                  </tr>
                </table>

                <table class="table-ledger">
                  <thead>
                    <tr>
                      <th class="c-no">No</th>
                      <th class="c-date">Date</th>
                      <th class="c-move">Good Moving</th>
                      <th class="c-mut">Mutasi</th>
                      <th class="c-stock">Stock</th>
                      <th class="c-note">Note</th>
                    </tr>
                  </thead>
                  <tbody>
                    <? for (var r = 1; r <= 15; r++) { ?>
                      <tr>
                        <td class="c-no"><?= r ?></td>
                        <td class="c-date"></td>
                        <td class="c-move"></td>
                        <td class="c-mut"></td>
                        <td class="c-stock"></td>
                        <td class="c-note"></td>
                      </tr>
                    <? } ?>
                  </tbody>
                </table>
              </div>
            <? } ?>
          </div>
        </div>
      <? } ?>

    <? } else if (data && data.mode === 'group') { ?>
      <!-- GROUP CARDS: 2 CARDS PER A4 SHEET -->
      <? for (var p = 0; p < data.pages.length; p++) {
           var page = data.pages[p];
      ?>
        <div class="a4-sheet">
          <div class="grid-group-2">
            <? for (var c = 0; c < page.cards.length; c++) {
                 var card = page.cards[c];
                 var qrPayload = encodeURIComponent(card.isBlank ? 'GROUP-BLANK' : (card.qrValue || 'GROUP:N/A'));
                 var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + qrPayload;
            ?>
              <div class="card-group-box">
                <!-- Diagonal Corner Cut Guidelines (45deg cutting line matching Tcard) -->
                <svg class="cut-line cut-line-tl" viewBox="0 0 10 10" title="diagonal upr to btl">
                  <line x1="0" y1="10" x2="10" y2="0" stroke="#616161" stroke-dasharray="2,1.5" stroke-width="0.8"/>
                </svg>
                <svg class="cut-line cut-line-tr" viewBox="0 0 10 10" title="diagonal upl to btr">
                  <line x1="0" y1="0" x2="10" y2="10" stroke="#616161" stroke-dasharray="2,1.5" stroke-width="0.8"/>
                </svg>

                <div class="single-header">
                  <div class="logo-container">
                    <img src="<?= data.logoUrl ?>" class="logo-img" alt="Logo Rekaindo">
                  </div>
                  <div class="hole-indicator" title="Hole Punch Guide">
                    <div class="hole-circle"></div>
                    <span class="hole-lbl">HOLE</span>
                  </div>
                  <div class="qr-container">
                    <? if (card.isBlank) { ?>
                      <div style="font-size:8pt; color:#9e9e9e; font-style:italic;">[ QR CODE ]</div>
                    <? } else { ?>
                      <img src="<?= qrUrl ?>" class="qr-img" alt="QR Code">
                    <? } ?>
                  </div>
                </div>

                <div class="main-card-title" style="font-size:12.5pt;">KARTU STOCK MATERIAL Group</div>

                <table class="meta-fields" style="font-size:9.5pt; margin-bottom:2.5mm;">
                  <tr>
                    <td class="lbl" style="width:30mm;">Kode Group :</td>
                    <td class="txt"><?= card.isBlank ? '..................................................' : (card.groupName || '-') ?></td>
                  </tr>
                  <tr>
                    <td class="lbl" style="width:30mm;">Deskription :</td>
                    <td class="txt"><?= card.isBlank ? '..................................................' : (card.deskripsi || '-') ?></td>
                  </tr>
                </table>

                <table class="table-group-ledger">
                  <thead>
                    <tr>
                      <th class="gc-no">No</th>
                      <th class="gc-komat">Komat</th>
                      <th class="gc-name">Name</th>
                      <th class="gc-mut">Mutasi</th>
                      <th class="gc-stock">Stock</th>
                    </tr>
                  </thead>
                  <tbody>
                    <?
                      var items = card.items || [];
                      for (var r = 0; r < 15; r++) {
                        var item = items[r];
                    ?>
                      <? if (item) { ?>
                        <tr>
                          <td class="gc-no"><?= r + 1 ?></td>
                          <td class="gc-komat"><?= item.komat ?></td>
                          <td class="gc-name"><?= item.name ?></td>
                          <td class="gc-mut"></td>
                          <td class="gc-stock"><?= item.qty ?> <?= item.uom ?></td>
                        </tr>
                      <? } else { ?>
                        <tr>
                          <td class="gc-no"><?= r + 1 ?></td>
                          <td class="gc-komat"></td>
                          <td class="gc-name"></td>
                          <td class="gc-mut"></td>
                          <td class="gc-stock"></td>
                        </tr>
                      <? } ?>
                    <? } ?>
                  </tbody>
                </table>
              </div>
            <? } ?>
          </div>
        </div>
      <? } ?>
    <? } ?>
  </div>

  <script>
    window.onload = function() {
      try {
        var svgs = document.querySelectorAll('.barcode-svg');
        for (var i = 0; i < svgs.length; i++) {
          var code = svgs[i].getAttribute('data-barcode');
          if (code && typeof JsBarcode === 'function') {
            JsBarcode(svgs[i], code, {
              format: "CODE128",
              lineColor: "#000000",
              width: 1.3,
              height: 30,
              displayValue: true,
              fontSize: 9,
              fontOptions: "bold",
              margin: 1
            });
          }
        }
      } catch (e) {
        console.error("Barcode render error:", e);
      }
    };
  </script>
</body>
</html>
