<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Cetak Kartu QR Login Pengguna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f0f2f5;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      color: #1a1a1a;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #1A237E;
      color: #ffffff;
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .toolbar select {
      font-family: inherit;
      font-size: 12px;
      border-radius: 6px;
      padding: 6px 12px;
      border: none;
      outline: none;
      background: #ffffff;
      color: #1a1a1a;
      font-weight: 600;
    }

    .btn-print {
      background: #00E676;
      color: #004D40;
      font-weight: 700;
      cursor: pointer;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-print:hover {
      background: #69F0AE;
    }

    .btn-close {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .a4-page {
      width: 210mm;
      margin: 15px auto;
      background: #ffffff;
      padding: 10mm;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(2, 90mm);
      gap: 10mm;
      justify-content: center;
    }

    .badge-card {
      width: 90mm;
      height: 55mm;
      border: 1.5px solid #212121;
      border-radius: 8px;
      padding: 3mm 4mm;
      display: flex;
      gap: 3mm;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .badge-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .badge-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-logo {
      height: 12mm;
      max-width: 32mm;
      object-fit: contain;
    }

    .badge-corp {
      font-size: 8pt;
      font-weight: 800;
      color: #1A237E;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .badge-user-info {
      margin: 2mm 0;
    }

    .badge-name {
      font-size: 10.5pt;
      font-weight: 800;
      color: #000000;
      line-height: 1.2;
    }

    .badge-email {
      font-size: 7.5pt;
      color: #616161;
      margin-top: 1mm;
    }

    .badge-username {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8pt;
      color: #424242;
      margin-top: 1mm;
    }

    .badge-role {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 7.5pt;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: fit-content;
    }

    .role-admin { background: #E8EAF6; color: #1A237E; border: 1px solid #C5CAE9; }
    .role-user { background: #E8F5E9; color: #1B5E20; border: 1px solid #C8E6C9; }
    .role-iit { display: none !important; }

    .badge-right {
      width: 28mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 1px dashed #BDBDBD;
      padding-left: 3mm;
    }

    .qr-img {
      width: 26mm;
      height: 26mm;
      object-fit: contain;
    }

    .scan-hint {
      font-size: 6pt;
      font-weight: 700;
      text-align: center;
      color: #757575;
      margin-top: 1.5mm;
      text-transform: uppercase;
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .a4-page {
        margin: 0;
        padding: 0;
        box-shadow: none;
        width: 100%;
      }
    }
  </style>
</head>

    let allUsers = [];
    let appLogo = DEFAULT_LOGO_DATA_URI;
    try {
      const initLogoEl = document.getElementById('initialLogoData');
      if (initLogoEl && initLogoEl.getAttribute('data-logo')) {
        const decodedLogo = decodeURIComponent(initLogoEl.getAttribute('data-logo'));
        if (decodedLogo && decodedLogo.length > 10 && decodedLogo.indexOf('<?') !== 0) {
          appLogo = decodedLogo;
        }
      }
    } catch (e) {}

    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(data) {
          allUsers = data.users || [];
          if (data.logoUri) {
            appLogo = data.logoUri;
          }

          populateUserFilter();
          renderFilteredBadges();
        })
        .withFailureHandler(function(err) {
          console.error('getUserQRModalData error:', err);
        })
        .getUserQRModalData();
    };

    function populateUserFilter() {
      const select = document.getElementById('userFilterSelect');
      select.innerHTML = '<option value="ALL">-- Cetak Semua Akun --</option>';

      allUsers.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.username;
        opt.textContent = `${u.name} (@${u.username}) - [${u.role}]`;
        select.appendChild(opt);
      });
    }

    function renderFilteredBadges() {
      const selected = document.getElementById('userFilterSelect').value;
      const container = document.getElementById('badgeContainer');
      container.innerHTML = '';

      const usersToRender = (selected === 'ALL')
        ? allUsers
        : allUsers.filter(u => u.username === selected);

      if (usersToRender.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; font-weight:600; color:#757575;">Tidak ada data pengguna yang tersedia untuk dicetak.</div>';
        return;
      }

      usersToRender.forEach(u => {
        const roleClass = (u.role.toLowerCase() === 'admin') ? 'role-admin' : 'role-user';

        const card = document.createElement('div');
        card.className = 'badge-card';
        card.innerHTML = `
          <div class="badge-left">
            <div class="badge-header">
              ${(appLogo || DEFAULT_LOGO_DATA_URI) ? `<img src="${appLogo || DEFAULT_LOGO_DATA_URI}" class="badge-logo" alt="Logo">` : ''}
              <div class="badge-corp">SMART VISUAL<br>WAREHOUSE</div>
            </div>
            <div class="badge-user-info">
              <div class="badge-name">${u.name}</div>
              <div class="badge-username">@${u.username}</div>
              <div class="badge-email">${u.email || '-'}</div>
            </div>
            <div>
              <span class="badge-role ${roleClass}">${u.role}</span>
            </div>
          </div>
          <div class="badge-right">
            <img src="${u.qrUrl}" class="qr-img" alt="QR Code">
            <div class="scan-hint">Scan to Login</div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
